# golangci-lint v2.14.0 config (version field required since v2).
# Release: github.com/golangci/golangci-lint v2.14.0, published 2026-09-24.
# Generated sqlc output is excluded; it is not hand-written.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    paths:
      - internal/store

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/store
