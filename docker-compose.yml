# P1 stack: Postgres, Grafana, pipelineiq-server.
# Jenkins and the agent arrive in P2. Memory limits are the plan's Phase 1 budget
# for these three containers (64 + 384 + 256 = 704 MB). They are limits, not
# measured usage.

name: pipelineiq

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: pipelineiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pipelineiq
    ports:
      - "5432:5432"
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelineiq -d pipelineiq"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      # Postgres 18 official image stores data in /var/lib/postgresql/18/docker.
      # The image VOLUME is /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - postgres-data:/var/lib/postgresql

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "3000:3000"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  pipelineiq-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PIPELINEIQ_HTTP_ADDR: ":8080"
      PIPELINEIQ_DATABASE_URL: postgres://pipelineiq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pipelineiq?sslmode=disable
      PIPELINEIQ_SHUTDOWN_TIMEOUT: 10s
      PIPELINEIQ_READY_TIMEOUT: 2s
      PIPELINEIQ_LOG_LEVEL: info
      # Soft cap under the 64m cgroup limit. Go 1.19+ also reads the cgroup limit.
      GOMEMLIMIT: 48MiB
    ports:
      - "8080:8080"
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
